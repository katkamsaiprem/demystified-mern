    <link rel="stylesheet" href="./style.css">

<body>
    <h1>Image Gallery </h1>
    <div class="gallery-container">
        <div class="gallery">
            <img src="https://newzoo.com/wp-content/uploads/api/games/artworks/game--counter-strike-2-go.jpg"
                class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=Minecraft" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=Fortnite" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=ROBLOX" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=Battlefield+6%2FREDSEC" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=League+of+Legends" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=ARC+Raiders" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=Dota+2" class="thumbnail">
            <img src="https://api.newzoo.com/v1.0/metadata/game/boxart?name=The+Sims+4" class="thumbnail">
        </div>
        <div class="modal">
            <div class="modal-overlay"></div>
            <button class="close-btn">close</button>
            <div class="modal-content">
                <img src="" alt="no img" class="modal-image">
            </div>
        </div>


    </div>
</body>
