<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./index.js"></script>
    <title>Document</title>
</head>

<body>
    <center>
        <label for="fullName">Full Name:</label>
        <input id="fullName" type="text" placeholder="Enter Your Name..." />
        <br>
        <label for="email">gmail</label>
        <input type="email" id="email" placeholder="enter gmail">
        <br>
        <label for="rollnumber">rollnumber</label>
        <input type="number" id="rollnumber" placeholder="enter rollnumber">
        <br>
        <label for="branch">Select Branch</label>
        <select name="branch" id="branch">
            <option value="ECE">ECE</option>
            <option value="CSE">CSE</option>
            <option value="CSGD">CSGD</option>
        </select>
        <br>
        <label for="age">age</label>
        <input type="number" id="age" placeholder="enter age">
        <br>
        <button type="submit" id="submit">submit</button>
        <br>

        <label for="searchRollNumber">Enter RollNumber to get info</label>
        <input type="number" id="searchRollNumber" placeholder="Enter RollNumber">

        <button id="searchButton">search</button>
    </center>



</body>

</html>
